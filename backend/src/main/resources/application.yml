server:
  port: 8080

spring:
  application:
    name: zhihuitong-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhihuitong.modules
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      table-underline: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zhihuitong: info

inspection:
  storage:
    upload-root: D:\lhr\Desktop\saas\photo/upload
    result-root: D:\lhr\Desktop\saas\photo/results

ai:
  yolo:
    enabled: true
    model-path: D:\lhr\Desktop\saas\docs\best.onnx
    conf-threshold: 0.5
    iou-threshold: 0.45
    video-conf-threshold: 0.25
    video-fallback-conf-threshold: 0.12
    video-iou-threshold: 0.40

qc:
  stream:
    frame-sample-interval-ms: 250
    session-idle-timeout-ms: 300000
    max-frame-size-bytes: 5242880

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: zhihuitong-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhihuitong.modules
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: assign_id
      table-underline: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always


  metrics:
    tags:
      application: zhihuitong

logging:
  level:
    com.zhihuitong: info

inspection:
  storage:
    upload-root: ${INSPECTION_STORAGE_UPLOAD_ROOT}
    result-root: ${INSPECTION_STORAGE_RESULT_ROOT}

ai:
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:true}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:30}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:1200}
  yolo:
    enabled: ${AI_YOLO_ENABLED:true}
    model-path: ${AI_YOLO_MODEL_PATH}

qc:
  stream:
    session-idle-timeout-ms: 300000
security:
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: ${JWT_EXPIRE_MINUTES:30}
    refresh-threshold-minutes: ${JWT_REFRESH_THRESHOLD_MINUTES:10}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
    expire-minutes: ${CAPTCHA_EXPIRE_MINUTES:5}
    length: 4

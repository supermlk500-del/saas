services:
  saas-redis:
    image: redis:7.4-alpine
    container_name: saas-redis
    restart: always
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
      redis-server --appendonly yes;
      fi'
    environment:
      - TZ=Asia/Shanghai
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - /opt/saas/redis:/data
    expose:
      - "6379"

  saas-backend:
    build:
      context: ./backend
    container_name: saas-backend
    restart: always
    depends_on:
      - saas-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-zhihuitong}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-zhihuitong}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - REDIS_HOST=saas-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - AI_YOLO_MODEL_PATH=/app/docs/best.onnx
      - INSPECTION_STORAGE_UPLOAD_ROOT=/app/data/upload
      - INSPECTION_STORAGE_RESULT_ROOT=/app/data/results
    volumes:
      - /opt/saas/docs:/app/docs:ro
      - /opt/saas/data:/app/data
    expose:
      - "8081"
    mem_limit: 900m
    cpus: 1.0

  saas-frontend:
    build:
      context: ./frontend
    container_name: saas-frontend
    restart: always
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - saas-backend
    mem_limit: 256m
    cpus: 0.5
